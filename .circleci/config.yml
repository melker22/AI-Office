version: 2.1

# AI Office CI: builds with the exact same Nix dev shell the README tells contributors to use
# (shell.nix — Qt 6, CMake, Ninja, zlib, Hunspell dicts), then runs every qa/wave*.json playbook
# headlessly as an integration smoke suite: each one is a recorded sequence of the real MCP tool
# calls an AI agent would make (document_new, insert_*, document_save, page_preview, validate...),
# so a green build means the AI-facing tool surface actually works end to end, not just "compiles".
#
# qa/wave1-foundation.json is a template playbook (its document_open path is a literal
# "PLACEHOLDER" meant to be substituted with a real file before running) and is intentionally
# excluded from the automatic sweep below.
#
# resource_class: large — xlarge was tried and rejected outright by this account/plan ("Task
# information unavailable", failed before the environment even spun up — not a build problem, an
# entitlement one), so large (4 vCPU) is the ceiling available here. With a warm Nix store cache
# (download time no longer a factor) and the one real compile error fixed (QImage::flipped(), see
# the Build step below), large got to 77/108 targets with zero errors, just out of time — that's
# what the build/linux cache below is for: once *one* full build completes and gets cached, any run
# with no or small source changes only recompiles what actually changed, fast regardless of
# resource_class, so the wall-clock ceiling stops mattering once the cache is warm.

jobs:
  build-and-test:
    docker:
      - image: nixos/nix:2.24.9
    resource_class: large
    steps:
      - checkout

      - run:
          name: Enable Nix flakes (harmless if unused) and disable the sandbox for the CI container
          command: |
            mkdir -p /etc/nix
            {
              echo "experimental-features = nix-command flakes"
              echo "sandbox = false"
            } >> /etc/nix/nix.conf

      - restore_cache:
          keys:
            - aioffice-nix-store-v1-{{ checksum "shell.nix" }}
            - aioffice-nix-store-v1-

      - run:
          name: Warm up the Nix store (pulls the whole Qt 6 toolchain from cache.nixos.org on a cold cache)
          # A cold nix-shell here pulls the entire Qt 6 closure (Qt itself plus its transitive
          # deps — GTK, systemd, cups, icu4c, harfbuzz, pango, X11/Wayland... several hundred
          # packages, since the GUI target pulls in the full desktop stack) from the binary cache.
          # Kept as its OWN step, saved to cache immediately below regardless of whether the build
          # itself later succeeds — every run so far has had the actual compile get cut off
          # (see the "Build" step below), which meant save_cache was never reached and every
          # single run kept paying this cold-download cost from scratch. Splitting it out breaks
          # that cycle: once this step succeeds once, every later run — including one whose build
          # is still too slow — restores a warm store and skips straight to compiling.
          no_output_timeout: 30m
          command: nix-shell --run "true"

      - save_cache:
          key: aioffice-nix-store-v1-{{ checksum "shell.nix" }}
          paths:
            - /nix

      # build/linux (cmake's own incremental-build state, ninja's .ninja_log/.ninja_deps included)
      # isn't reset between runs like a fresh checkout would — restoring the *previous* run's
      # partial-or-complete build here means ninja only recompiles what actually changed (or, if
      # the previous run got cut off mid-build like every run so far, simply picks up where it left
      # off) instead of redoing all 108 targets from scratch every single time. Keyed on the commit
      # so a retry of the exact same commit gets an exact hit; falls back to the branch's most
      # recent build otherwise.
      - restore_cache:
          keys:
            - aioffice-build-v1-{{ .Branch }}-{{ .Revision }}
            - aioffice-build-v1-{{ .Branch }}-
            - aioffice-build-v1-

      - run:
          name: Configure (cmake --preset linux, inside nix-shell)
          no_output_timeout: 10m
          command: nix-shell --run "cmake --preset linux"

      - run:
          name: Build (cmake --build --preset linux, inside nix-shell)
          # -j$(nproc): ninja auto-detects parallelism from the *host* CPU count, which can be
          # higher than what this container's resource_class actually gets — over-subscribing
          # parallel GCC invocations on a couple of real cores causes thrashing that can silently
          # stall a build for a long time. Pinning -j to the container's own nproc avoids that.
          # -k 0: keep going past a failed file instead of stopping at the first error. CI-only —
          # the point is to surface every independent compile error from a single run (this is how
          # we found the QImage::flipped() Qt-version mismatch below: local dev uses whatever Nix
          # channel resolves on this machine, currently Qt 6.11; CircleCI's image resolves an older
          # channel, Qt 6.7.2 — an API added after 6.7 compiles locally but not in CI) rather than
          # trickling out one error per push.
          no_output_timeout: 20m
          command: nix-shell --run "cmake --build --preset linux -- -j\$(nproc) -k 0"

      # when: always — save whatever got built even if the step above timed out/failed, so a
      # cut-off run still leaves the *next* run something to resume from instead of starting over.
      - save_cache:
          key: aioffice-build-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - build/linux
          when: always

      - run:
          name: Run qa/wave*.json playbooks (headless MCP tool smoke suite)
          command: |
            export AIOFFICE_HEADLESS=1
            status=0
            for f in qa/wave*.json; do
              case "$f" in
                qa/wave1-foundation.json) continue ;; # template, needs a real path substituted first
              esac
              echo "=== $f ==="
              if ! nix-shell --run "./build/linux/aioffice play $f" > /tmp/last-playbook-output.json; then
                echo "--- FAILED: $f ---"
                cat /tmp/last-playbook-output.json
                status=1
              fi
            done
            exit $status

      - run:
          name: aioffice tools (sanity check the tool catalog still parses)
          command: nix-shell --run "./build/linux/aioffice tools" > /tmp/tools.json

      - store_artifacts:
          path: /tmp/last-playbook-output.json
          destination: last-playbook-output.json

workflows:
  build:
    jobs:
      - build-and-test
