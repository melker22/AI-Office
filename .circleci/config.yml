version: 2.1

# AI Office CI: same pinned Nix shell as the README (flake.lock → Qt, CMake,
# Ninja, zlib, Hunspell), then every qa/wave*.json playbook headlessly.
# Each playbook is a recorded sequence of the real MCP tool calls an AI agent
# would make, so green means the AI-facing tool surface works, not just "links".
#
# qa/wave1-foundation.json is a template (document_open path is the literal
# "PLACEHOLDER") and is excluded from the sweep.
#
# Why aioffice_cli, not the GUI target: the full `aioffice` binary pulls in
# qmlimportscanner + per-file QML caching + rcc across 23 QML files. On this
# plan's ceiling (resource_class large — xlarge is rejected; a cancellation
# skips every later step including `when: always` save_cache) that 108-target
# build never finished, so the smoke suite never ran. `aioffice_cli` is
# aioffice_core + a thin QGuiApplication main (offscreen), which is exactly
# what `play`/`mcp`/`tools` need. The GUI target stays a local/dev build.

jobs:
  build-and-test:
    docker:
      - image: nixos/nix:2.24.9
    resource_class: large
    environment:
      QT_QPA_PLATFORM: offscreen
      AIOFFICE_HEADLESS: "1"
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - checkout

      - run:
          name: Enable Nix flakes and disable the sandbox for the CI container
          command: |
            mkdir -p /etc/nix
            {
              echo "experimental-features = nix-command flakes"
              echo "sandbox = false"
            } >> /etc/nix/nix.conf

      - restore_cache:
          keys:
            - aioffice-nix-store-v2-{{ checksum "flake.lock" }}
            - aioffice-nix-store-v2-

      - run:
          name: Warm up the Nix store (pinned flake.lock Qt 6 toolchain)
          no_output_timeout: 30m
          command: nix-shell --run "true"

      - save_cache:
          key: aioffice-nix-store-v2-{{ checksum "flake.lock" }}
          paths:
            - /nix

      - restore_cache:
          keys:
            - aioffice-ccache-v2-{{ checksum "flake.lock" }}-{{ .Branch }}-
            - aioffice-ccache-v2-{{ checksum "flake.lock" }}-
            - aioffice-ccache-v2-

      - restore_cache:
          keys:
            - aioffice-build-cli-v2-{{ .Branch }}-{{ .Revision }}
            - aioffice-build-cli-v2-{{ .Branch }}-
            - aioffice-build-cli-v2-

      - run:
          name: Configure (cmake --preset linux, inside nix-shell)
          no_output_timeout: 10m
          command: nix-shell --run "cmake --preset linux"

      - run:
          name: Build aioffice_cli (core + headless main, no QML)
          no_output_timeout: 15m
          command: nix-shell --run "cmake --build --preset linux --target aioffice_cli -- -j\$(nproc) -k 0"

      # Saved before the playbooks so a later test failure still leaves a warm
      # ninja/ccache tree for the next commit. Keyed on revision so a retry of
      # the same SHA is an exact hit; prefix fallback is the previous SHA on
      # this branch.
      - save_cache:
          key: aioffice-build-cli-v2-{{ .Branch }}-{{ .Revision }}
          paths:
            - build/linux

      - save_cache:
          key: aioffice-ccache-v2-{{ checksum "flake.lock" }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /tmp/ccache

      - run:
          name: CTest playbooks and roundtrip fixtures (headless MCP smoke suite)
          command: |
            nix-shell --run "ctest --test-dir build/linux --output-on-failure -L 'playbook|roundtrip'" \
              > /tmp/last-playbook-output.txt 2>&1 || {
              echo "--- ctest FAILED ---"
              tail -n 80 /tmp/last-playbook-output.txt
              exit 1
            }

      - store_artifacts:
          path: /tmp/last-playbook-output.json
          destination: last-playbook-output.json

workflows:
  build:
    jobs:
      - build-and-test
