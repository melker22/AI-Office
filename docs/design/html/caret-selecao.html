<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Caret e seleção — Tinta & Papel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#E4DDD2; font-family:"IBM Plex Sans",sans-serif; }
  .page { width:720px; min-height:400px; margin:48px auto; background:#FDFBF7; box-shadow:0 4px 24px rgba(42,36,32,.10); padding:80px 72px; font-family:"Source Serif 4",serif; color:#2A2420; }
  .sel { background:rgba(181,101,29,.125); }
  .caret { display:inline-block; width:2px; height:18px; background:#B5651D; vertical-align:text-bottom; animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .mini { position:absolute; background:#2A2420; color:#FDFBF7; border-radius:12px; height:36px; display:flex; align-items:center; padding:0 8px; gap:4px; font-size:12px; }
</style>
</head>
<body>
<div class="page" style="position:relative">
  <div class="mini" style="top:24px;left:72px">＋ ⊞  |  H  |  ⇤ ⇔ ⇥  |  ⌫</div>
  <p>Serviços de <span class="sel">consultoria estratégica</span><span class="caret"></span> em transformação digital.</p>
</div>
</body>
</html>
