<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Comentários da IA — Tinta & Papel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin:0; display:flex; font-family:"IBM Plex Sans",sans-serif; background:#E4DDD2; min-height:100vh; }
  .page { flex:1; display:flex; justify-content:center; padding:48px; }
  .sheet { width:720px; background:#FDFBF7; padding:80px 72px; font-family:"Source Serif 4",serif; }
  mark { background:rgba(181,101,29,.2); border-bottom:2px solid rgba(181,101,29,.4); }
  .n { display:inline-flex; width:16px; height:16px; border-radius:8px; background:#B5651D; color:#fff; font-size:10px; align-items:center; justify-content:center; font-family:"IBM Plex Sans",sans-serif; }
  aside { width:320px; background:#FAF8F5; border-left:1px solid #E4DDD2; padding:16px; }
  .card { background:#FBF7F0; border:1px solid rgba(181,101,29,.3); border-radius:12px; padding:12px; margin-bottom:12px; }
  .av { width:24px; height:24px; border-radius:12px; background:#B5651D; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  button { height:28px; padding:0 12px; border-radius:6px; background:#B5651D; color:#fff; border:0; font-weight:600; font-size:11px; }
</style>
</head>
<body>
<div class="page"><div class="sheet"><p>A redução de latência <mark>em dispositivos móveis <span class="n">1</span></mark> abriu portas para apps offline.</p></div></div>
<aside>
  <div class="card">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><div class="av">IA</div><strong style="font-size:12px">Assistente</strong></div>
    <p style="font-size:12.5px;color:#3A322C">Sugiro incluir dados de latência (ms).</p>
    <button>Resolver</button>
  </div>
</aside>
</body>
</html>
