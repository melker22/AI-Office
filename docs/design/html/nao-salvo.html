<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Documento não salvo — Tinta & Papel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:"IBM Plex Sans",sans-serif; background:#E4DDD2; }
  .overlay { min-height:100vh; display:flex; align-items:center; justify-content:center; background:rgba(42,36,32,.10); }
  .card { width:420px; background:#FBF7F0; border:1px solid #E4DDD2; border-radius:16px; padding:32px; text-align:center; }
  .icon { width:56px; height:56px; border-radius:28px; background:#FBF0E6; color:#B5651D; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:22px; }
  h2 { margin:0 0 8px; color:#2A2420; font-size:19px; }
  p { margin:0 0 24px; color:#6B5F51; font-size:14px; line-height:1.5; }
  button { display:block; width:100%; height:40px; border-radius:12px; font-weight:700; font-size:13px; margin-bottom:8px; cursor:pointer; font-family:inherit; }
  .primary { background:#B5651D; color:#fff; border:0; }
  .discard { background:transparent; color:#B4402A; border:1px solid rgba(180,64,42,.2); }
  .ghost { background:transparent; color:#8A7D6C; border:0; }
</style>
</head>
<body>
<div class="overlay">
  <div class="card">
    <div class="icon">▤</div>
    <h2>Documento não salvo</h2>
    <p>Deseja salvar as alterações em “Proposta Comercial.docx” antes de fechar?</p>
    <button class="primary">Salvar alterações</button>
    <button class="discard">Descartar</button>
    <button class="ghost">Cancelar</button>
  </div>
</div>
</body>
</html>
