<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Workspace multi-página — Tinta & Papel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#E4DDD2; font-family:"IBM Plex Sans",sans-serif; }
  .stack { display:flex; flex-direction:column; align-items:center; gap:40px; padding:48px 0 80px; }
  .page { width:720px; height:280px; background:#FDFBF7; box-shadow:0 4px 24px rgba(42,36,32,.10); }
  .status { position:fixed; bottom:0; left:0; right:0; height:36px; background:#362F28; color:#AFA391; display:flex; align-items:center; padding:0 16px; gap:12px; font-size:11.5px; }
  .nav { background:#4E453B; border-radius:6px; padding:4px 10px; display:flex; gap:8px; align-items:center; color:#D6CCBB; }
</style>
</head>
<body>
<div class="stack">
  <div class="page"></div>
  <div class="page"></div>
</div>
<div class="status">
  <div class="nav">‹ Página 2 de 2 ›</div>
  <span>·</span><span>842 palavras</span>
</div>
</body>
</html>
