version: 1
name: wave20-epub-rtf
description: >
  Onda 20 — EPUB 3 (export) e RTF nativo (import + export). Spec: docs/waves/wave20-epub-rtf.md.
  epubcheck é o juiz do EPUB; ida e volta própria + fixtures + LibreOffice são o juiz do RTF.
args:
  opus_audit:
    default: "false"
    description: "true = auditoria final do Opus antes do PR"
defaults:
  agent: cursor
  model: composer-2.5
  approval: full-access
max_parallel: 4
nodes:
  # ── Fase 0: lições do PR anterior ─────────────────────────────────────────────
  lessons:
    title: Lições do PR anterior (Sonnet)
    agent: claude
    model: claude-sonnet-5
    effort: medium
    prompt: |
      Projeto AI Office Writer. Mantenha docs/LESSONS.md e .cursor/rules/lessons.mdc. Não altere código.
      1. Veja em docs/LESSONS.md a linha "Última PR processada". Liste os PRs mergeados depois dela em
         melker22/AI-Office (tool MCP do GitHub; `gh` não existe). Nenhum novo → não mude nada.
      2. Para cada PR novo, leia as threads do CodeRabbit (pull_request_read get_review_comments) e as
         entradas correspondentes em docs/AI_HANDOFF.md E docs/AI_HANDOFF_ARCHIVE.md (achados do
         Sonnet, intervenções) — entradas antigas podem ter sido arquivadas.
      3. Para cada defeito real que chegou ao CodeRabbit ou exigiu intervenção: se é instância de uma
         lição existente, acrescente a evidência e incremente a contagem; se é padrão novo que pode se
         repetir, crie lição com regra VERIFICÁVEL. Sem evidência (link de thread/commit) não entra.
      4. Reescreva o checklist de .cursor/rules/lessons.mdc (máx. 15 itens, os mais recorrentes) e
         atualize "Última PR processada".
      5. Commit `docs: update lessons from PR #N` em inglês, sem push. Submeta commit =
         `git rev-parse HEAD` (mesmo sem mudanças), qa_green = true, summary com as lições novas.
    success_output: qa_green
    output_contract: &executor_contract
      type: object
      required: [commit, qa_green, summary]
      properties:
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        qa_green: { type: boolean }
        blocker: { type: string }
        summary: { type: string }

  # ── Fase 1: EPUB (Grok) ∥ RTF writer (Composer) ∥ RTF reader (Grok) ∥ QA (Composer) ──
  t1-epub:
    title: T1 EPUB 3 + XHTML (Cursor Grok 4.7)
    needs: [lessons]
    model: grok-4.7-high
    workspace: isolated
    prompt: |
      Projeto AI Office Writer (C++20/Qt 6). PRIMEIRO: `git merge {{needs.lessons.output.commit}}`.
      Leia docs/waves/wave20-epub-rtf.md (D1–D3, D8 fechadas), docs/ORCHESTRATION.md e o checklist de
      .cursor/rules/lessons.mdc. Só src/core/Epub.{h,cpp}, src/core/Xhtml.{h,cpp}, src/core/Zip.{h,cpp}
      (se precisar de entrada stored), a rasterização de bloco em Preview.{h,cpp}, a ligação de `.epub`
      em Session::saveTo, ToolDispatch/docs/mcp-tools.md, CMakeLists.txt (fontes) e qa/. NÃO mexa em
      export_html nem em RTF (outras tarefas).
      Implemente D1–D2 e prove com `nix-shell -p epubcheck --run "epubcheck <arquivo>"` (0 erros, 0
      avisos) num documento com H1 em capítulos, tabela com cabeçalho, lista aninhada, nota, imagem com
      alt, forma/gráfico rasterizado, parágrafo RTL, span em outro idioma, campo if e hide_if.
      Playbook qa/wave20-epub.json com expect. `scripts/qa-all.sh --gui` verde. Commit em inglês, sem
      push. Submeta commit = `git rev-parse HEAD`, qa_green, summary.
    success_output: qa_green
    output_contract: *executor_contract

  t2-rtf-writer:
    title: T2 RTF writer (Composer)
    needs: [lessons]
    workspace: isolated
    prompt: |
      Projeto AI Office Writer (C++20/Qt 6). PRIMEIRO: `git merge {{needs.lessons.output.commit}}`.
      Leia docs/waves/wave20-epub-rtf.md (D4, D8) e o checklist de lições. Só src/core/RtfWriter.{h,cpp}
      (novo), a ligação de `.rtf` em Session::saveTo, CMakeLists.txt (fontes), docs/mcp-tools.md e qa/.
      NÃO toque no leitor RTF nem em Session::openFrom (outra tarefa).
      Exporte o subconjunto D4 (fonttbl, colortbl, stylesheet, parágrafo, caractere, listtable, tabelas
      com \trhdr, \page, \footnote, \pict\pngblip, \field, \bkmkstart, \uN/\ucN, \rtlpar, \lang);
      revisões/comentários/formas como texto + warnings[]. Prove abrindo o arquivo com
      `soffice --headless --convert-to odt` e conferindo o texto/estrutura. Playbook qa/wave20-rtf-out.json
      com expect. `scripts/qa-all.sh --gui` verde. Commit em inglês, sem push. Submeta commit/qa_green/summary.
    success_output: qa_green
    output_contract: *executor_contract

  t3-rtf-reader:
    title: T3 RTF reader seguro (Cursor Grok 4.7)
    needs: [lessons]
    model: grok-4.7-high
    workspace: isolated
    prompt: |
      Projeto AI Office Writer (C++20/Qt 6). PRIMEIRO: `git merge {{needs.lessons.output.commit}}`.
      Leia docs/waves/wave20-epub-rtf.md (D4, D5, D8) e o checklist de lições (L1 é central aqui). Só
      src/core/RtfReader.{h,cpp} (novo), o ramo `.rtf` de Session::openFrom (passa a ser só nativo; `.doc`
      continua via soffice), CMakeLists.txt (fontes) e qa/. NÃO toque no writer RTF (outra tarefa).
      Importe o subconjunto D4; D5: limite de profundidade de grupos, de tamanho de \pict e de \bin N,
      \'hh pelo \ansicpg, destinos \* desconhecidos ignorados, erro claro (nunca crash) para RTF
      malformado. Teste com fixtures escritas à mão (estilo Word com \listtable e \field; estilo
      LibreOffice) e com RTF gerado pelo LibreOffice a partir de um ODT nosso; casos hostis (10000 grupos
      aninhados, \bin gigante, \u fora de faixa). Playbook qa/wave20-rtf-in.json com expect.
      `scripts/qa-all.sh --gui` verde. Commit em inglês, sem push. Submeta commit/qa_green/summary.
    success_output: qa_green
    output_contract: *executor_contract

  t4-formats-qa:
    title: T4 epubcheck + ctest epub/rtf (Composer)
    needs: [lessons]
    workspace: isolated
    prompt: |
      Projeto AI Office Writer. PRIMEIRO: `git merge {{needs.lessons.output.commit}}`. Leia
      docs/waves/wave20-epub-rtf.md (D6, critério de pronto) e o checklist de lições. Só shell.nix,
      CMakeLists.txt (testes), scripts/qa-all.sh, scripts/qa-interop.py, .circleci/config.yml, qa/ e docs/.
      1. `epubcheck` no shell.nix fixado.
      2. qa/check_epub.py: exporta um playbook, roda epubcheck (0 erros E 0 avisos; parse da saída),
         confere mimetype stored primeiro, nav, lang e notas; expectativas num .epub.json ao lado.
         qa/check_rtf.py: ida e volta aio→rtf→aio e import de fixtures contra um .rtf.json de expectativa.
         subprocess com timeout e check=False explícito (L1/L10).
      3. Documentos de teste cobrindo cada item do critério de pronto (EPUB e RTF) + fixtures RTF
         estrangeiras escritas à mão (estilo Word e LibreOffice) e casos hostis.
      4. ctest LABELS epub e rtf; `scripts/qa-all.sh --formats` liga os labels (combinável); com
         --interop, qa-interop.py também leva RTF pelo LibreOffice nos dois sentidos; CI roda
         `ctest -L "playbook|roundtrip|pdf|epub|rtf"`.
      Os testes novos FALHAM até T1–T3 entrarem (esperado): qa_green aqui = `scripts/qa-all.sh --gui`
      verde e os checkers funcionando (mostre um caso que passa e um que falha com a mensagem certa).
      Commit em inglês, sem push. Submeta commit/qa_green/summary.
    success_output: qa_green
    output_contract: *executor_contract

  integrate-1:
    title: Integrar T1–T4 (Composer)
    needs: [t1-epub, t2-rtf-writer, t3-rtf-reader, t4-formats-qa]
    prompt: |
      Neste worktree, faça `git merge` dos commits EXATOS, nesta ordem:
      {{needs.t1-epub.output.commit}}, {{needs.t2-rtf-writer.output.commit}},
      {{needs.t3-rtf-reader.output.commit}}, {{needs.t4-formats-qa.output.commit}}.
      Conflitos esperados em CMakeLists.txt (fontes/testes), Session.cpp (save .epub/.rtf vs open .rtf),
      docs/mcp-tools.md e AI_HANDOFF: mantenha todas as adições. Rode `scripts/qa-all.sh --gui`; corrija só
      quebras de merge, commit. Submeta commit = HEAD após os merges, qa_green, summary.
    success_output: qa_green
    output_contract: *executor_contract

  build-1:
    type: gate
    gate: command
    needs: [integrate-1, lessons, t1-epub, t2-rtf-writer, t3-rtf-reader, t4-formats-qa]
    run: scripts/fleet-verify-merged.sh 6 && scripts/qa-all.sh --gui

  # ── Fase 2: conformidade (Grok, no worktree integrado) ───────────────────────
  t5-compliance:
    title: T5 conformidade epubcheck + RTF (Cursor Grok 4.7)
    needs: [build-1]
    model: grok-4.7-high
    prompt: |
      Projeto AI Office Writer, worktree integrado da onda 20. Leia docs/waves/wave20-epub-rtf.md e o
      checklist de .cursor/rules/lessons.mdc. Rode `scripts/qa-all.sh --gui --interop --formats` e
      corrija o código (não os testes nem as expectativas) até tudo passar: epubcheck 0 erros/0 avisos,
      ida e volta RTF, fixtures estrangeiras, interop LibreOffice. Regra do epubcheck ou comportamento do
      LibreOffice que pareça impossível → PARE e reporte "PRECISA OPUS: ..." com evidência; não afrouxe.
      Rode também `scripts/qa-all.sh --gui --interop --pdf --formats`. Commit em inglês, sem push.
      Submeta commit/qa_green/summary.
    success_output: qa_green
    output_contract: *executor_contract

  qa-full:
    type: gate
    gate: command
    needs: [t5-compliance]
    run: scripts/fleet-verify-merged.sh 1 && scripts/qa-all.sh --gui --interop --pdf --formats

  # ── Fase 3: revisão Sonnet + correção Grok Build ─────────────────────────────
  review:
    type: loop
    needs: [qa-full]
    max_iterations: 3
    on_exhausted: review-adjudication
    until:
      run: test "{{needs.review-pass.output.issues}}" -eq 0 && scripts/fleet-verify-merged.sh 1
    nodes:
      review-pass:
        agent: claude
        model: claude-sonnet-5
        effort: high
        session: continue
        prompt: |
          Você é o Tech Lead. PRIMEIRO verifique no diff cada item de .cursor/rules/lessons.mdc. Depois
          revise `git diff main...HEAD` contra docs/waves/wave20-epub-rtf.md (D1–D8, critério de pronto):
          epubcheck e a ida e volta RTF são os juízes — rode `scripts/qa-all.sh --gui --interop --pdf
          --formats`; procure entradas que a suíte não cobre e que quebrariam (RTF hostil: grupos
          profundos, \bin, \pict enorme, codepages; EPUB com nota dentro de tabela, imagem sem alt, H1
          vazio, títulos repetidos, caracteres que precisam de escape em XHTML), regressões das ondas
          12–19. Não corrija nada. Só defeitos reais. Submeta issues e findings ("arquivo:linha — defeito
          — correção sugerida").
        followup_prompt: |
          Houve correção. Verifique de novo o checklist de lições e `git diff main...HEAD`, rode
          `scripts/qa-all.sh --gui --interop --pdf --formats` e submeta só os findings que continuam ou surgiram.
        output_contract:
          type: object
          required: [issues, findings]
          properties:
            issues: { type: integer, minimum: 0 }
            findings: { type: array, items: { type: string } }
      fix-pass:
        needs: [review-pass]
        agent: grok
        model: grok-4.7
        effort: high
        prompt: |
          Projeto AI Office Writer (spec: docs/waves/wave20-epub-rtf.md; checklist .cursor/rules/lessons.mdc).
          Findings: {{needs.review-pass.output.findings}}
          Lista vazia → não altere nada. Senão corrija, rode `scripts/qa-all.sh --gui --interop --pdf --formats`
          e commit `fix: ...` em inglês, sem push. Submeta commit = `git rev-parse HEAD`, qa_green, summary.
        success_output: qa_green
        output_contract: *executor_contract

  review-adjudication:
    title: Adjudicação final (Sonnet)
    needs: [review]
    agent: claude
    model: claude-sonnet-5
    effort: high
    prompt: |
      Três passadas não zeraram os findings. Descarte os que não são defeitos (com motivo), faça UMA
      correção direta dos reais (com commit), rode `scripts/qa-all.sh --gui --interop --pdf --formats` e pare.
      Nunca pergunte a um humano. Submeta também commit = `git rev-parse HEAD` e resolved = true só se
      nenhum defeito real ficou aberto.
    success_output: resolved
    output_contract:
      type: object
      required: [verdict, resolved, accepted, dismissed, commit]
      properties:
        verdict: { type: string, enum: [resolved, failed] }
        resolved: { type: boolean }
        accepted: { type: array, items: { type: string } }
        dismissed: { type: array, items: { type: string } }
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }

  opus-audit:
    title: Auditoria Opus (opcional)
    needs: [review-adjudication]
    enabled: "{{args.opus_audit}}"
    agent: claude
    model: claude-opus-5-5
    effort: high
    prompt: |
      Auditoria final de `git diff main...HEAD` contra docs/waves/wave20-epub-rtf.md (foco: leitor RTF
      seguro e estrutura do pacote EPUB). Corrija só o crítico, commit. Submeta commit/qa_green/summary.
    success_output: qa_green
    output_contract: *executor_contract

  qa-final:
    type: gate
    gate: command
    needs: [opus-audit, review-adjudication, t5-compliance]
    run: scripts/fleet-verify-merged.sh 1 && scripts/qa-all.sh --gui --interop --pdf --formats

  handoff:
    title: Handoff + catálogo (Composer)
    needs: [qa-final]
    prompt: |
      Atualize só estes arquivos e commit `docs: ...` em inglês, sem push:
      - docs/AI_HANDOFF.md: entrada nova no topo (modelo "Fleet wave20 — Composer/Cursor Grok/Grok
        Build/Sonnet"), com o resultado REAL de `scripts/qa-all.sh --gui --interop --pdf --formats`
        (rode-o) e `git log main..HEAD --oneline`. Não cite o hash do próprio commit.
      - docs/WRITER_FEATURE_CATALOG.md: "Exportação EPUB" e "RTF nativo" conforme o entregue (o que
        ficou como texto/warnings); DOC nativo segue Todo via soffice; novos Todos "Importar EPUB",
        "Revisões e comentários em RTF" e "export_html no escritor XHTML".
      Submeta commit/qa_green/summary. Resumo da revisão: {{needs.review.report}}
    success_output: qa_green
    output_contract: *executor_contract

  notion-sync:
    title: Sincronizar Notion (Sonnet)
    needs: [handoff]
    agent: claude
    model: claude-sonnet-5
    effort: low
    prompt: |
      Sincronize o Notion com o repositório (regra: documentação sempre atualizada). Tools MCP do
      Notion; NÃO altere código; NÃO apague nem arquive páginas. Fontes: docs/WRITER_FEATURE_CATALOG.md,
      topo de docs/AI_HANDOFF.md, docs/waves/wave20-epub-rtf.md, docs/LESSONS.md. Notion: hub
      3cb46a79156b819daef5ea9d7c41385a; board collection://f3cc11ed-9e5e-4389-b49a-ca98f98dda62;
      snapshot 3cb46a79156b8117a87fc72cd190f8c6. Alinhe as linhas tocadas pela onda 20 (Exportação EPUB, RTF nativo,
      e as linhas Todo novas do catálogo), atualize "Última sync" do hub e o snapshot. Reporte as mudanças.

  approve-pr:
    type: gate
    gate: human
    needs: [notion-sync]
    ask: |
      Onda 20 (EPUB 3 validado pelo epubcheck sem erros nem avisos, e RTF nativo — import seguro e
      export, sem precisar do LibreOffice) está pronta num branch local da Fleet:
      scripts/qa-all.sh --gui --interop --pdf --formats verde no branch final, revisão Sonnet concluída e
      Notion já sincronizado.
      Aprovar = push do branch e PR para main (CI e CodeRabbit rodam no GitHub). Rejeitar = nada sai.

  open-pr:
    title: Push + PR (Sonnet)
    needs: [approve-pr]
    when: "needs.approve-pr.approved"
    agent: claude
    model: claude-sonnet-5
    effort: medium
    prompt: |
      Push deste branch para origin (nunca main) e PR para `main` em melker22/AI-Office via tool MCP do
      GitHub. Título em inglês `feat: wave 20 — EPUB 3 export and native RTF import/export`.
      Corpo: resumo de docs/waves/wave20-epub-rtf.md (inclua o diagnóstico), test plan e o handoff:
      {{needs.handoff.report}}. Não reescreva commits. Reporte a URL.
