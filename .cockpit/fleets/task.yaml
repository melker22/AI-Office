version: 1
name: task
description: >
  Pipeline padrão para qualquer tarefa do AI Office: Sonnet planeja → executor implementa
  → gate de QA → Sonnet revisa / Grok Build corrige (até 3x) → aprovação humana → PR.
  Executor padrão = Cursor Grok. Trocar com --set 'implement.model=composer-2.5' (tarefa
  simples) ou --set 'implement.agent=grok' --set 'implement.model=grok-4.7' (Cursor sem limite).
args:
  task:
    required: true
    description: O que fazer (1–3 frases)
  spec:
    default: ""
    description: Caminho opcional de uma spec em docs/ (ex. docs/waves/wave17-x.md)
defaults:
  agent: cursor
  model: grok-4.7-high
  approval: full-access
max_parallel: 1
nodes:
  # Harnessing entre tarefas (ideia do Harness²): lições com evidência do último PR mergeado
  # viram regras para esta execução. Ver docs/LESSONS.md e docs/ORCHESTRATION.md.
  lessons:
    title: Lições do PR anterior (Sonnet)
    agent: claude
    model: claude-sonnet-5
    effort: medium
    prompt: |
      Projeto AI Office Writer. Mantenha docs/LESSONS.md e .cursor/rules/lessons.mdc. Não altere código.
      1. Veja em docs/LESSONS.md a linha "Última PR processada". Liste os PRs mergeados depois dela em
         melker22/AI-Office (tool MCP do GitHub; `gh` não existe). Nenhum novo → não mude nada.
      2. Para cada PR novo, leia as threads do CodeRabbit (pull_request_read get_review_comments) e as
         entradas correspondentes em docs/AI_HANDOFF.md E docs/AI_HANDOFF_ARCHIVE.md (achados do
         Sonnet, intervenções) — entradas antigas podem ter sido arquivadas.
      3. Para cada defeito real que chegou ao CodeRabbit ou exigiu intervenção: se é instância de uma
         lição existente, acrescente a evidência e incremente a contagem; se é um padrão novo que pode
         se repetir, crie uma lição com regra VERIFICÁVEL. Sem evidência (link de thread/commit) não entra.
      4. Reescreva o checklist de .cursor/rules/lessons.mdc com no máximo 15 itens, os mais recorrentes.
         Atualize "Última PR processada".
      5. Commit `docs: update lessons from PR #N` em inglês, sem push. Submeta commit =
         `git rev-parse HEAD` (mesmo sem mudanças), qa_green = true, summary com as lições novas.
    success_output: qa_green
    output_contract:
      type: object
      required: [commit, qa_green, summary]
      properties:
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        qa_green: { type: boolean }
        blocker: { type: string }
        summary: { type: string }

  plan:
    title: Plano (Sonnet)
    needs: [lessons]
    agent: claude
    model: claude-sonnet-5
    effort: medium
    prompt: |
      Projeto AI Office Writer. Leia docs/AI_HANDOFF.md (entrada do topo), .cursor/rules/*.mdc
      e, se não for vazio, a spec "{{args.spec}}".
      Tarefa: {{args.task}}
      Não altere nada. Produza um plano de implementação concreto para um executor sem
      contexto: arquivos e funções a tocar, passos numerados, playbook qa/*.json com `expect`
      que prova o resultado, riscos. Se a tarefa exigir decisão arquitetural que não está na
      spec, diga isso explicitamente na primeira linha ("PRECISA OPUS: ...").

  implement:
    title: Implementação
    needs: [plan]
    prompt: |
      Projeto AI Office Writer (C++20/Qt 6). Siga .cursor/rules/*.mdc, em especial o checklist
      de .cursor/rules/lessons.mdc (confira cada item antes de submeter qa_green).
      Tarefa: {{args.task}}
      Plano do Tech Lead:
      {{needs.plan.report}}
      Implemente, crie/atualize o playbook indicado, rode `scripts/qa-all.sh --gui` até ficar
      verde. Commit em inglês (feat:/fix:), sem push. Reporte arquivos e decisões.
      Ao terminar, submeta a saída estruturada: commit = `git rev-parse HEAD` depois do seu
      último commit; qa_green = true só se `scripts/qa-all.sh --gui` passou nesse commit (se não,
      false e explique em blocker); summary = 1–3 frases.
    success_output: qa_green
    output_contract:
      type: object
      required: [commit, qa_green, summary]
      properties:
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        qa_green: { type: boolean }
        blocker: { type: string }
        summary: { type: string }

  qa:
    type: gate
    gate: command
    needs: [implement]
    # O commit reportado pelo executor tem de estar no HEAD testado (fleet-verify-merged.sh).
    run: scripts/fleet-verify-merged.sh 1 && scripts/qa-all.sh --gui

  review:
    type: loop
    needs: [qa]
    max_iterations: 3
    on_exhausted: adjudicate
    until:
      # Encerra só com 0 findings E com o commit reportado pelo fix-pass presente no HEAD.
      run: test "{{needs.review-pass.output.issues}}" -eq 0 && scripts/fleet-verify-merged.sh 1
    nodes:
      review-pass:
        agent: claude
        model: claude-sonnet-5
        effort: high
        session: continue
        prompt: |
          Você é o Tech Lead. Tarefa original: {{args.task}}
          Primeiro verifique no diff cada item de .cursor/rules/lessons.mdc. Depois revise
          `git diff main...HEAD` contra a tarefa e o plano, rode `scripts/qa-all.sh
          --gui`. Não corrija nada. Só defeitos reais. Submeta issues e findings
          ("arquivo:linha — defeito — correção").
        followup_prompt: |
          Houve correção. Revise de novo `git diff main...HEAD`, rode `scripts/qa-all.sh --gui`
          e submeta só os findings que continuam ou surgiram.
        output_contract:
          type: object
          required: [issues, findings]
          properties:
            issues: { type: integer, minimum: 0 }
            findings: { type: array, items: { type: string } }
      fix-pass:
        needs: [review-pass]
        agent: grok
        model: grok-4.7
        effort: high
        prompt: |
          Findings do revisor: {{needs.review-pass.output.findings}}
          Lista vazia → não altere nada e reporte "nada a corrigir". Senão corrija, rode
          `scripts/qa-all.sh --gui`, commit `fix: ...` em inglês, sem push.
          Ao terminar, submeta: commit = `git rev-parse HEAD` (mesmo sem mudanças); qa_green = true
          só se `scripts/qa-all.sh --gui` passou nesse commit; summary = o que corrigiu ou "nada a corrigir".
        success_output: qa_green
        output_contract:
          type: object
          required: [commit, qa_green, summary]
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            qa_green: { type: boolean }
            blocker: { type: string }
            summary: { type: string }

  adjudicate:
    needs: [review]
    agent: claude
    model: claude-sonnet-5
    effort: high
    prompt: |
      Três passadas não zeraram os findings. Descarte os que não são defeitos (com motivo),
      faça UMA correção direta dos reais (com commit), rode `scripts/qa-all.sh --gui` e pare.
      Nunca pergunte a um humano. Submeta também commit = `git rev-parse HEAD`, mesmo sem mudanças,
      e resolved = true só se nenhum defeito real ficou aberto.
    success_output: resolved
    output_contract:
      type: object
      required: [verdict, resolved, accepted, dismissed, commit]
      properties:
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        verdict: { type: string, enum: [resolved, failed] }
        resolved: { type: boolean }
        accepted: { type: array, items: { type: string } }
        dismissed: { type: array, items: { type: string } }

  # Gate final: fix-pass/adjudicate podem comitar depois do qa-full, então o branch
  # final é testado de novo antes do handoff e da aprovação humana.
  qa-final:
    type: gate
    gate: command
    # implement listado explicitamente para o gate receber FLEET_NEEDS_IMPLEMENT_OUTPUT. O commit do
    # adjudicate (quando ele roda) também é verificado; mínimo 1 porque no caminho normal ele é pulado.
    needs: [adjudicate, implement]
    run: scripts/fleet-verify-merged.sh 1 && scripts/qa-all.sh --gui

  handoff:
    needs: [qa-final]
    model: composer-2.5
    prompt: |
      Adicione uma entrada no topo de docs/AI_HANDOFF.md (formato do template) para a tarefa
      "{{args.task}}", com os hashes de `git log main..HEAD --oneline`; atualize
      docs/WRITER_FEATURE_CATALOG.md se um item mudou de status. Commit `docs: ...`, sem push.

  notion-sync:
    needs: [handoff]
    agent: claude
    model: claude-sonnet-5
    effort: low
    prompt: |
      Sincronize o Notion com o repositório (regra do projeto: documentação sempre atualizada). Use
      as tools MCP do Notion; NÃO altere código; NÃO apague nem arquive páginas.
      Tarefa concluída: "{{args.task}}". Fontes: docs/WRITER_FEATURE_CATALOG.md e topo de
      docs/AI_HANDOFF.md. Notion: hub page 3cb46a79156b819daef5ea9d7c41385a; board data source
      collection://f3cc11ed-9e5e-4389-b49a-ca98f98dda62; snapshot page 3cb46a79156b8117a87fc72cd190f8c6.
      Alinhe ao catálogo as linhas tocadas, atualize o callout "Última sync" do hub e o snapshot.
      Reporte as linhas alteradas.

  approve-pr:
    type: gate
    gate: human
    needs: [notion-sync]
    ask: |
      AI Office — tarefa concluída num branch local da Fleet, QA verde e revisada pelo Sonnet:
      "{{args.task}}". Aprovar = push do branch + PR para main (CI e CodeRabbit rodam no
      GitHub). Rejeitar = nada sai da máquina.

  open-pr:
    needs: [approve-pr]
    when: "needs.approve-pr.approved"
    agent: claude
    model: claude-sonnet-5
    effort: low
    prompt: |
      Push deste branch para origin (nunca main) e PR para `main` em melker22/AI-Office via
      tool MCP do GitHub. Título em inglês. Corpo: tarefa, resumo do handoff e test plan.
      Handoff: {{needs.handoff.report}}
      Reporte a URL.
